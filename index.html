<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Outlet</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="admin-container">

    <!-- =====================================================
         HEADER — STATS SLIDER
    ===================================================== -->

    <header class="admin-stats">

        <div class="stats-track" id="statsTrack">

            <!-- All -->
            <div class="stat-card" data-city="All">
                <div class="stat-city">Hamısı</div>
                <div class="stat-row">
                    <span class="stat-badge stat-time">
                        <i class="fa-regular fa-clock"></i>
                        <strong class="stat-time-value">0</strong>
                    </span> 
                    <span class="stat-badge stat-active">
                        <i class="fa-solid fa-circle-check"></i>
                        <strong class="stat-active-value">0</strong>
                    </span>
                </div>
            </div>

            <!-- Baki -->
            <div class="stat-card" data-city="Baki">
                <div class="stat-city">Bakı</div>
                <div class="stat-row">
                    <span class="stat-badge stat-time">
                        <i class="fa-regular fa-clock"></i>
                        <strong class="stat-time-value">0</strong>
                    </span> 
                    <span class="stat-badge stat-active">
                        <i class="fa-solid fa-circle-check"></i>
                        <strong class="stat-active-value">0</strong>
                    </span>
                </div>
            </div>

            <!-- Sumgayit -->
            <div class="stat-card" data-city="Sumgayit">
                <div class="stat-city">Sumqayıt</div>
                <div class="stat-row">
                    <span class="stat-badge stat-time">
                        <i class="fa-regular fa-clock"></i>
                        <strong class="stat-time-value">0</strong>
                    </span>
                    <span class="stat-badge stat-active">
                        <i class="fa-solid fa-circle-check"></i>
                        <strong class="stat-active-value">0</strong>
                    </span>
                </div>
            </div>

            <!-- Quba -->
            <div class="stat-card" data-city="Quba">
                <div class="stat-city">Quba</div>
                <div class="stat-row">
                    <span class="stat-badge stat-time">
                        <i class="fa-regular fa-clock"></i>
                        <strong class="stat-time-value">0</strong>
                    </span>
                    <span class="stat-badge stat-active">
                        <i class="fa-solid fa-circle-check"></i>
                        <strong class="stat-active-value">0</strong>
                    </span>
                </div>
            </div>

            <!-- Qusar -->
            <div class="stat-card" data-city="Qusar">
                <div class="stat-city">Qusar</div>
                <div class="stat-row">
                    <span class="stat-badge stat-time">
                        <i class="fa-regular fa-clock"></i>
                        <strong class="stat-time-value">0</strong>
                    </span>
                    <span class="stat-badge stat-active">
                        <i class="fa-solid fa-circle-check"></i>
                        <strong class="stat-active-value">0</strong>
                    </span>
                </div>
            </div>

            <!-- Xacmaz -->
            <div class="stat-card" data-city="Xacmaz">
                <div class="stat-city">Xaçmaz</div>
                <div class="stat-row">
                    <span class="stat-badge stat-time">
                        <i class="fa-regular fa-clock"></i>
                        <strong class="stat-time-value">0</strong>
                    </span>
                    <span class="stat-badge stat-active">
                        <i class="fa-solid fa-circle-check"></i>
                        <strong class="stat-active-value">0</strong>
                    </span>
                </div>
            </div>

        </div>

        <!-- scroll gradient hints (auto-toggled by JS) -->
        <div class="stats-fade stats-fade-left"></div>
        <div class="stats-fade stats-fade-right"></div>

    </header>


    <!-- =====================================================
         PENDING ADS
    ===================================================== -->

    <section class="pending-section">

        <div class="section-head">

            <div class="section-head-left">
                <span class="section-count" id="pendingCount">0</span>
            </div>

            <button type="button" class="approve-all-btn" id="approveAllBtn">
                <i class="fa-solid fa-check-double"></i>
                <span>Hamısını təsdiqlə</span>
            </button>

        </div>


        <!-- Pending ads list — populated by JS -->
        <div class="pending-list" id="pendingList"></div>


        <!-- Empty state -->
        <div class="empty-state" id="emptyState" style="display:none;">
            <i class="fa-regular fa-face-smile"></i>
            <h3>Gözləyən elan yoxdur</h3>
            <p>Bütün elanlar yoxlanılıb.</p>
        </div>

    </section>


    <!-- =====================================================
         ADS MANAGEMENT (5 slots)
    ===================================================== -->

    <section class="ads-manage-section">

        <div class="section-head">
            <div class="section-head-left">
                <h2>Reklamlar</h2>
            </div>
        </div>


        <div class="ads-manage-grid" id="adsManageGrid">

            <!-- 5 slots rendered by JS -->

        </div>

    </section>

</div>


<!-- =====================================================
     TOAST CONTAINER
===================================================== -->

<div class="toast-container" id="toastContainer"></div>


<!-- =====================================================
     CONFIRM MODAL
===================================================== -->

<div class="confirm-modal" id="confirmModal">

    <div class="confirm-overlay" data-confirm-close></div>

    <div class="confirm-box">

        <div class="confirm-icon" id="confirmIcon">
            <i class="fa-solid fa-question"></i>
        </div>

        <h3 class="confirm-title" id="confirmTitle">Əminsiniz?</h3>

        <p class="confirm-text" id="confirmText">
            Bu əməliyyatı təsdiqləmək istədiyinizə əminsiniz?
        </p>

        <div class="confirm-actions">

            <button type="button"
                    class="confirm-btn confirm-cancel"
                    data-confirm-close>
                Ləğv et
            </button>

            <button type="button"
                    class="confirm-btn confirm-ok"
                    id="confirmOk">
                Təsdiqlə
            </button>

        </div>

    </div>

</div>


<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="app.js"></script>

</body>
</html>
